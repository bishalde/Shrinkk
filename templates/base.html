<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shrinkk{% endblock %} | Smart Link Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
                        surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' },
                    },
                    fontFamily: { sans: ['Inter','system-ui','-apple-system','sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn .5s ease-out',
                        'fade-up': 'fadeUp .6s ease-out',
                        'slide-in-right': 'slideInRight .3s ease-out',
                        'slide-in-up': 'slideInUp .3s ease-out',
                        'scale-in': 'scaleIn .2s ease-out',
                        'marquee': 'marquee 30s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'count-up': 'countUp 1s ease-out',
                    },
                    keyframes: {
                        fadeIn: { from:{opacity:'0'}, to:{opacity:'1'} },
                        fadeUp: { from:{opacity:'0',transform:'translateY(20px)'}, to:{opacity:'1',transform:'translateY(0)'} },
                        slideInRight: { from:{opacity:'0',transform:'translateX(20px)'}, to:{opacity:'1',transform:'translateX(0)'} },
                        slideInUp: { from:{opacity:'0',transform:'translateY(10px)'}, to:{opacity:'1',transform:'translateY(0)'} },
                        scaleIn: { from:{opacity:'0',transform:'scale(.95)'}, to:{opacity:'1',transform:'scale(1)'} },
                        marquee: { '0%':{transform:'translateX(0)'},'100%':{transform:'translateX(-50%)'} },
                        float: { '0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-10px)'} },
                    },
                    boxShadow: {
                        'glass': '0 0 0 1px rgba(255,255,255,.05), 0 2px 4px rgba(0,0,0,.02), 0 12px 24px rgba(0,0,0,.04)',
                        'card': '0 0 0 1px rgba(0,0,0,.03), 0 1px 3px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.04)',
                        'elevated': '0 0 0 1px rgba(0,0,0,.02), 0 4px 12px rgba(0,0,0,.05), 0 20px 40px rgba(0,0,0,.07)',
                        'glow': '0 0 40px rgba(99,102,241,.15)',
                        'glow-lg': '0 0 80px rgba(99,102,241,.2)',
                    },
                }
            }
        }
    </script>
    <style>
        *{font-family:'Inter',system-ui,-apple-system,sans-serif}
        .gradient-brand{background:linear-gradient(135deg,#4f46e5 0%,#6366f1 50%,#818cf8 100%)}
        .gradient-brand-dark{background:linear-gradient(135deg,#312e81 0%,#3730a3 50%,#4338ca 100%)}
        .gradient-dark{background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%)}
        .gradient-mesh{background:linear-gradient(135deg,#667eea11 0%,#764ba211 100%)}
        .glass{background:rgba(255,255,255,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
        .glass-dark{background:rgba(15,23,42,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
        .text-gradient{background:linear-gradient(135deg,#4f46e5,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hover-lift{transition:all .25s cubic-bezier(.4,0,.2,1)}.hover-lift:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.08)}
        .hover-scale{transition:all .2s ease}.hover-scale:hover{transform:scale(1.02)}
        .btn-press{transition:transform .1s ease}.btn-press:active{transform:scale(.97)}
        /* Toast */
        #toast-container{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
        .toast-item{padding:.75rem 1rem;border-radius:.75rem;font-size:.8125rem;font-weight:600;animation:slideInUp .3s ease-out,fadeOut .3s ease-in 2.7s forwards;display:flex;align-items:center;gap:.5rem}
        @keyframes fadeOut{to{opacity:0;transform:translateY(-10px)}}
        @keyframes slideInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        /* Scrollbar */
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#94a3b8}
        /* Mobile menu */
        .mobile-menu{transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}.mobile-menu.open{transform:translateX(0)}
        .overlay{opacity:0;pointer-events:none;transition:opacity .3s ease}.overlay.open{opacity:1;pointer-events:auto}
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-white text-surface-900 min-h-screen antialiased">
    <div id="toast-container"></div>
    {% block body %}{% endblock %}
    <script>
        lucide.createIcons();
        function showToast(msg, type='success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            const colors = {success:'bg-emerald-600 text-white',error:'bg-red-600 text-white',info:'bg-surface-800 text-white'};
            const icons = {success:'check-circle',error:'alert-circle',info:'info'};
            t.className = 'toast-item shadow-elevated ' + (colors[type]||colors.info);
            t.innerHTML = '<i data-lucide="'+icons[type]+'" class="w-4 h-4"></i>' + msg;
            c.appendChild(t);
            lucide.createIcons({nodes:[t]});
            setTimeout(()=>t.remove(), 3000);
        }
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard!'));
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
