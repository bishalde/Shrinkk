{% extends "base.html" %}
{% block title %}Expired{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-surface-50">
    <div class="text-center p-8 animate-fade-up">
        <div class="w-20 h-20 rounded-2xl bg-amber-50 border border-amber-100 flex items-center justify-center mx-auto mb-6">
            <i data-lucide="clock" class="w-8 h-8 text-amber-500"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-surface-900">Link Expired</h1>
        <p class="text-sm text-surface-400 mt-2 mb-8 max-w-xs mx-auto">This short link has expired and is no longer active.</p>
        <a href="/" class="px-6 py-2.5 gradient-brand text-white rounded-xl font-semibold text-sm hover:shadow-glow transition-all btn-press">Go Home</a>
    </div>
</div>
{% endblock %}
